<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ── Google OAuth token capture ───────────────────────────────────────
         This inline script MUST run before any module import (including
         Firebase). Firebase Auth initialises synchronously on import and
         reads/clears URL hash parameters named "state" and "id_token" — the
         same names Google uses for the OpenID Connect implicit response.
         By capturing and stashing the token here we guarantee it survives. -->
    <script>
      (function () {
        var h = window.location.hash.slice(1);
        if (!h) return;
        var p = new URLSearchParams(h);
        var t = p.get('id_token');
        var s = p.get('state');
        if (t) {
          sessionStorage.setItem('ff_t', t);
          sessionStorage.setItem('ff_s', s || '');
          // Remove the hash immediately so nothing else can consume it.
          history.replaceState(null, '', window.location.pathname);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ── PWA / iPhone install ─────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinFlow" />
    <meta name="theme-color" content="#0d1117" />  <!-- default dark; updated at runtime by finflow-v3.jsx -->
    <meta name="application-name" content="FinFlow" />

    <!-- ── Icons ─────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/finflow/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/finflow/favicon-16.png" />
    <link rel="apple-touch-icon" href="/finflow/apple-touch-icon.png" />
    <link rel="manifest" href="/finflow/manifest.json" />

    <title>FinFlow</title>
    <script type="module" crossorigin src="/finflow/assets/index-BsPImRR4.js"></script>
    <link rel="stylesheet" crossorigin href="/finflow/assets/index-8FGNAqlp.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ── Service Worker registration ───────────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/finflow/sw.js', { scope: '/finflow/' })
            .then(function (reg) {
              console.log('FinFlow SW registered:', reg.scope);
            })
            .catch(function (err) {
              console.warn('SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
